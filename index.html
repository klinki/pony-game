<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pony Game - Race</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="game-container">
        <h1>Pony Race</h1>
        <div id="ui-layer">
            <div id="stamina-bar-container">
                <span>Stamina: </span>
                <div class="bar-bg"><div id="stamina-bar"></div></div>
            </div>
            <div id="speed-display">Speed: <span id="speed-value">0</span></div>
            <div id="message-area">Press Spacebar to Start!</div>
        </div>
        <canvas id="race-track"></canvas>
    </div>

    <script type="module" src="js/game.js"></script>
</body>
</html>
